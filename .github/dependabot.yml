# Dependency updates (PRD §14.1): npm packages (pnpm workspace) and GitHub Actions, weekly.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node types follow the Node version in .nvmrc (22), not the newest Node.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Every github/codeql-action step must use the same version.
      codeql:
        patterns: ['github/codeql-action*']
